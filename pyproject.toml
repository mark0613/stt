[project]
name = "stt"
version = "0.1.0"
description = "以 Gemini 將長音檔轉成帶說話者標記與時間戳的逐字稿"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=1.65.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rich>=15.0.0",
]

[project.scripts]
stt = "stt.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stt"]
